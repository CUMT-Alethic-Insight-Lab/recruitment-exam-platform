# Alethic Insight 官网 — 腾讯云轻量源站（nginx）
# 配置位置：/etc/nginx/sites-available/alethicinsight → sites-enabled 软链
#
# 2026-08-09 起：公网流量全部经 Cloudflare Tunnel（cloudflared → http://127.0.0.1:80）。
# TLS 在 Cloudflare 边缘终止，源站不再监听 443，站点内容只对本机回源暴露。
# 警告：不要在隧道回源的 vhost 上加 80→443 跳转——访客已在 CF 边缘完成 HTTPS，
#       源站跳转会造成循环重定向。
#
# 2026-09-29 起：招新平台主库迁至实验室内网小主机（lab-origin.alethicinsight.com，
# 经该主机自己的 CF 隧道回源）。云端本地 8901 降级为热备：lab 故障（502/503/504，
# 含 CF 隧道不可达 521/522/530）时 error_page 回落本地副本，回退模式下仅放行
# GET/HEAD（本地副本每 5 分钟由 lab 推送刷新，写操作一律 503）。
# 注意：lab 方向的 Host 必须固定为 lab-origin.alethicinsight.com，否则 CF 边缘
# 会按 Host 把请求又路由回本机隧道造成环路；proxy_ssl_server_name 保证 SNI。
#
# 2026-10-16：lab_origin 上游启用长连接池（keepalive 16 / keepalive_timeout 300s，
# proxy_http_version 1.1 + Connection ""），消除每请求 TCP+TLS 穿越隧道握手。
# 配套：root crontab 每分钟 4 连发 /recruitment/api/health 保活连接池
#（覆盖 2 个 worker 各自的连接池，防止闲置 60s 后冷启动重建握手）。
# 教训（同日事故）：upstream 组场景必须显式 proxy_ssl_name 指定真实域名，
# 否则 SNI 取组名 "lab_origin"，CF 边缘 TLS 层拒握手（alert 40）；且热备
# error_page 会静默接管 GET 请求使故障无感——验证主链路务必检查响应头
# 无 X-Alethic-Origin: cloud-standby，并用 POST（热备会拒 503）双重确认。

upstream lab_origin {
    server lab-origin.alethicinsight.com:443;
    keepalive 16;
    keepalive_timeout 300s;
}

server {
    listen 127.0.0.1:80;
    server_name alethicinsight.com www.alethicinsight.com;

    # 访客 scheme 感知的 HTTP→HTTPS 跳转（2026-09-30）：
    # CF 边缘在 CF-Visitor 头里携带访客真实 scheme；仅当访客走 http 时 301。
    # 不监听端口做盲跳，因此不会与隧道回源（本机 127.0.0.1:80）形成循环。
    if ($http_cf_visitor ~* (?i)"scheme":"http") {
        return 301 https://$host$request_uri;
    }

    root /var/www/alethicinsight/current;
    index index.html;
    client_max_body_size 100m;  # 机试清洗件上传（CF 免费版上限 100MB）

    # 招新平台：strip /recruitment/ 前缀后反代到 lab 主库。
    location = /recruitment {
        absolute_redirect off;
        return 301 /recruitment/;
    }
    # ^~ 必须保留：命中后不再检查下方静态资源正则 location，
    # 否则 /recruitment/static/mark.svg 之类会被主站 try_files 抢走返回 404
    location ^~ /recruitment/ {
        proxy_pass https://lab_origin/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name lab-origin.alethicinsight.com;  # upstream 组场景必须显式指定，否则 SNI=组名 lab_origin，CF 拒握手
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        proxy_set_header Host lab-origin.alethicinsight.com;
        include /etc/nginx/snippets/cf-access-lab-origin.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 520 521 522 523 524 525 526 530 = @recruitment_fallback;
    }
    # 热备：本地 uvicorn 副本（lab 推送的只读快照）。命名 location 内 proxy_pass
    # 不能带 URI 部分，用 rewrite...break 还原应用内部路径。
    location @recruitment_fallback {
        if ($request_method !~ ^(GET|HEAD)$) { return 503; }
        rewrite ^/recruitment/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8901;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Alethic-Origin cloud-standby always;
    }

    # 管理端入口独立为 /admin/recruitment（不再挂在 /recruitment 之下）；
    # 应用内部路由仍是 /admin，这里做精确映射，旧地址 301 过渡
    location = /recruitment/admin {
        absolute_redirect off;
        return 301 /admin/recruitment;
    }
    location = /admin/recruitment/ {
        absolute_redirect off;
        return 301 /admin/recruitment;
    }
    location = /admin/recruitment {
        proxy_pass https://lab_origin/admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name lab-origin.alethicinsight.com;  # upstream 组场景必须显式指定，否则 SNI=组名 lab_origin，CF 拒握手
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        proxy_set_header Host lab-origin.alethicinsight.com;
        include /etc/nginx/snippets/cf-access-lab-origin.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 520 521 522 523 524 525 526 530 = @admin_fallback;
    }
    location @admin_fallback {
        if ($request_method !~ ^(GET|HEAD)$) { return 503; }
        rewrite ^/admin/recruitment.*$ /admin break;
        proxy_pass http://127.0.0.1:8901;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Alethic-Origin cloud-standby always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # vite 指纹产物长缓存；HTML/JSON 短缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(html|json)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # public/ 下的静态资源（图片/字体/PDF/视频，文件名不带指纹）：7 天缓存
    location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?|ttf|otf|pdf|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# 公网 80 唯一监听：其余四个域名的兜底跳转（CF 侧已有页面规则 301 到 com）。
server {
    listen 80 default_server;
    server_name alethicinsight.cn alethicinsight.org aletheion.cn aletheion.org.cn;

    location /.well-known/ { root /var/www/acme; }
    location / { return 301 https://alethicinsight.com$request_uri; }
}
