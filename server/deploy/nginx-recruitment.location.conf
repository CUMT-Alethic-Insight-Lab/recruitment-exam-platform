# 参考片段：把招新平台挂到主站 /recruitment/ 路径下，管理端独立为 /admin/recruitment。
# 位置：/etc/nginx/sites-available/alethicinsight 的 `listen 127.0.0.1:80` server 块内，
#       必须放在 `location /`（try_files）之前。
# 代理到 uvicorn（127.0.0.1:8901）；proxy_pass 末尾带 `/` 会 strip 掉 /recruitment/ 前缀，
# 应用内部路由保持无前缀。TLS 在 Cloudflare 边缘终止，回源统一 http，
# 因此 X-Forwarded-Proto 固定传 https 给应用。
# 公网流量经 Cloudflare Tunnel 回源 127.0.0.1:80，此 location 自动公网可达，无需改 CF。

# 账号页属于主站；复用下方代理，API/资源仍走 /recruitment/，保留旧 URL。
location = /login { rewrite ^ /recruitment/login last; }
location = /account { rewrite ^ /recruitment/account last; }
location = /login/ {
    absolute_redirect off;
    return 301 /login$is_args$args;
}
location = /account/ {
    absolute_redirect off;
    return 301 /account$is_args$args;
}

location = /recruitment {
    # nginx 只看到隧道回源的 http，默认会拼出绝对 http:// Location，
    # 这里关掉绝对化，保持相对 Location（浏览器/CF 都能正确处理）
    absolute_redirect off;
    return 301 /recruitment/;
}

# ^~ 必须保留：命中后不再检查主站的静态资源正则 location
# （\.(png|svg|css|...)$），否则 /recruitment/static/mark.svg 之类
# 会被主站 try_files 抢走返回 404（2026-09 实际踩过）
location ^~ /recruitment/ {
    # 机试清洗件/附件上传走这条链，nginx 默认 1MB 会直接 413（2026-09 实际踩过）；
    # CF 免费版上传上限 100MB，这里对齐
    client_max_body_size 100m;
    proxy_pass http://127.0.0.1:8901/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# 管理端入口 /admin/recruitment（不再挂在 /recruitment 之下）；
# 应用内部路由仍是 /admin，这里做精确映射，旧地址 301 过渡。
# 应用页面里的管理端链接由环境变量 ADMIN_PUBLIC_PATH=/admin/recruitment 生成。
location = /recruitment/admin {
    absolute_redirect off;
    return 301 /admin/recruitment;
}
location = /admin/recruitment/ {
    absolute_redirect off;
    return 301 /admin/recruitment;
}
location = /admin/recruitment {
    proxy_pass http://127.0.0.1:8901/admin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
