[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alethic-mcp-adapter"
version = "0.1.0"
description = "Local stdio MCP adapter for the Alethic CLI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
alethic-mcp = "alethic_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alethic_mcp*"]
