[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alethic-cli"
version = "0.1.0"
description = "Alethic Insight organization API command-line client"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
alethic = "alethic_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alethic_cli*"]
